name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 打包（排除仓库周边文件，只带网站本体）
        run: zip -r geometric-islands-${{ github.ref_name }}.zip . -x '.git/*' '.github/*' '.workbuddy/*'
      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: geometric-islands-${{ github.ref_name }}.zip
